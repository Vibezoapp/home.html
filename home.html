<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Vibzo - Home</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
    }

    .app {
      width: 100%;
      height: 100vh;
      position: relative;
      background: #000;
    }

    /* TOP BAR */

    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 65px;
      z-index: 20;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 18px;

      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.65),
        transparent
      );
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      background: linear-gradient(
        90deg,
        #ff0050,
        #00f2ea
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .search-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,0.35);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
    }


    /* VIDEO FEED */

    .feed {
      width: 100%;
      height: 100vh;

      overflow-y: scroll;
      scroll-snap-type: y mandatory;

      scrollbar-width: none;
    }

    .feed::-webkit-scrollbar {
      display: none;
    }


    .video-card {
      position: relative;

      width: 100%;
      height: 100vh;

      scroll-snap-align: start;

      background: #111;
      overflow: hidden;
    }


    .video {
      width: 100%;
      height: 100%;

      object-fit: cover;

      background: #111;
    }


    /* DARK GRADIENT */

    .gradient {
      position: absolute;

      left: 0;
      bottom: 0;

      width: 100%;
      height: 45%;

      background: linear-gradient(
        to top,
        rgba(0,0,0,0.8),
        transparent
      );

      pointer-events: none;
    }


    /* VIDEO INFO */

    .video-info {
      position: absolute;

      left: 15px;
      bottom: 80px;

      width: calc(100% - 90px);

      z-index: 5;
    }

    .username {
      font-size: 18px;
      font-weight: bold;

      margin-bottom: 10px;
    }

    .follow {
      margin-left: 8px;

      padding: 5px 10px;

      border: 1px solid #fff;
      border-radius: 6px;

      background: transparent;
      color: #fff;

      font-size: 12px;
      cursor: pointer;
    }

    .caption {
      font-size: 15px;
      line-height: 1.4;

      margin-bottom: 9px;
    }

    .music {
      font-size: 13px;
      opacity: 0.9;
    }


    /* RIGHT ACTION BUTTONS */

    .actions {
      position: absolute;

      right: 12px;
      bottom: 85px;

      width: 55px;

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 18px;

      z-index: 10;
    }

    .action {
      border: none;
      background: transparent;

      color: #fff;

      display: flex;
      flex-direction: column;
      align-items: center;

      cursor: pointer;
    }

    .action-icon {
      width: 45px;
      height: 45px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(0,0,0,0.35);

      font-size: 24px;
    }

    .action-count {
      font-size: 12px;
      margin-top: 3px;
    }

    .liked .action-icon {
      color: #ff0050;
    }


    /* BOTTOM NAVIGATION */

    .bottom-nav {
      position: fixed;

      left: 0;
      bottom: 0;

      width: 100%;
      height: 62px;

      z-index: 30;

      display: flex;
      justify-content: space-around;
      align-items: center;

      background: rgba(0,0,0,0.85);

      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .nav-item {
      border: none;
      background: transparent;

      color: #aaa;

      font-size: 11px;

      display: flex;
      flex-direction: column;
      align-items: center;

      cursor: pointer;
    }

    .nav-icon {
      font-size: 22px;
      margin-bottom: 2px;
    }

    .nav-item.active {
      color: #fff;
    }


    /* PAUSE ICON */

    .pause-icon {
      position: absolute;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      width: 65px;
      height: 65px;

      border-radius: 50%;

      background: rgba(0,0,0,0.45);

      display: none;

      align-items: center;
      justify-content: center;

      font-size: 30px;

      z-index: 15;
    }

    .paused .pause-icon {
      display: flex;
    }


    /* SEARCH PANEL */

    .search-panel {
      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100vh;

      background: #101014;

      z-index: 100;

      display: none;

      padding: 25px 18px;
    }

    .search-panel.show {
      display: block;
    }

    .search-header {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .search-input {
      flex: 1;

      height: 45px;

      border: none;
      outline: none;

      border-radius: 10px;

      background: #22222a;
      color: #fff;

      padding: 0 15px;

      font-size: 15px;
    }

    .close-search {
      width: 45px;
      height: 45px;

      border: none;
      border-radius: 10px;

      background: #22222a;

      color: #fff;

      font-size: 20px;
    }


    /* DESKTOP */

    @media (min-width: 600px) {

      .app {
        max-width: 500px;
        margin: auto;
      }

      .bottom-nav {
        max-width: 500px;
        left: 50%;
        transform: translateX(-50%);
      }

      .top-bar {
        max-width: 500px;
        left: 50%;
        transform: translateX(-50%);
      }

    }

  </style>
</head>


<body>

    <!-- VIDEO 2 -->

        loop

      <div class="gradient"></div>

      </div>

      <div class="video-info">

          @vibzo

          <button
            class="follow"
            onclick="followUser(this)"
          >

        </div>

        <div class="caption">

        </div>

        </div>

      <div class="actions">

        >

        <button

        <button

        >

        <button

        >

    <!-- VIDEO 3 -->

      <video

      <div class="gradient"></div>

      <div class="video-info">

        <div class="caption">

        </div>

<script>

  /* =========================================
     VIDEO AUTO PLAY
     ========================================= */

  const videos =
    document.querySelectorAll(".video");


  const observer =
    new IntersectionObserver(
      (entries) => {

        entries.forEach(entry => {

          const video =
            entry.target;

          if (entry.isIntersecting) {

            video.play()
              .catch(() => {});

          }
          else {

            video.pause();

          }

        });

      },
      {
        threshold: 0.7
      }
    );


  videos.forEach(video => {

    observer.observe(video);

  });


  /* =========================================
     PLAY / PAUSE
     ========================================= */

  videos.forEach(video => {

    video.parentElement
      .addEventListener(
        "click",
        function(event) {

          if (
            event.target.closest(".actions") ||
            event.target.closest(".follow")
          ) {
            return;
          }

          if (video.paused) {

            video.play();

            this.classList.remove(
              "paused"
            );

          }
          else {

            video.pause();

            this.classList.add(
              "paused"
            );

          }

        }
      );

  });


  /* =========================================
     LIKE
     ========================================= */

  function likeVideo(button) {

    button.classList.toggle("liked");

    const count =
      button.querySelector(
        ".action-count"
      );

    let number =
      parseInt(count.innerText) || 0;


    if (
      button.classList.contains("liked")
    ) {

      number++;

    }
    else {

      number--;

    }

    count.innerText = number;

  }


  /* =========================================
     FOLLOW
     ========================================= */

  function followUser(button) {

    if (
      button.innerText === "Follow"
    ) {

      button.innerText =
        "Following";

      button.style.background =
        "#fff";

      button.style.color =
        "#000";

    }
    else {

      button.innerText =
        "Follow";

      button.style.background =
        "transparent";

      button.style.color =
        "#fff";

    }

  }


  /* =========================================
     COMMENT
     ========================================= */

  function commentVideo() {

    alert(
      "Comment system খুব শীঘ্রই আসছে! 💬"
    );

  }


  /* =========================================
     SHARE
     ========================================= */

  async function shareVideo() {

    if (
      navigator.share
    ) {

      try {

        await navigator.share({

          title:
            "Vibzo",

          text:
            "Check out this video on Vibzo!",

          url:
            window.location.href

        });

      }
      catch (error) {}

    }
    else {

      alert(
        "Share feature আপনার browser-এ নেই।"
      );

    }

  }


  /* =========================================
     PROFILE
     ========================================= */

  function showProfile() {

    alert(
      "Profile page শীঘ্রই তৈরি করা হবে। 👤"
    );

  }


  /* =========================================
     SEARCH
     ========================================= */

  function openSearch() {

    document
      .getElementById(
        "searchPanel"
      )
      .classList.add("show");

  }


  function closeSearch() {

    document
      .getElementById(
        "searchPanel"
      )
      .classList.remove("show");

  }


  /* =========================================
     CREATE / UPLOAD
     ========================================= */

  function uploadComingSoon() {

    alert(
      "Video Upload system পরের ধাপে তৈরি করা হবে। 🎬"
    );

  }

</script>
