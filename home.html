<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vibzo - Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 25px;
    }

    .logo {
      text-align: center;
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 10px;
      background: linear-gradient(45deg, #ff0050, #00f2ea);
      -webkit-background-clip: text;
      color: transparent;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    .box {
      background: #151515;
      padding: 25px;
      border-radius: 18px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: none;
      outline: none;
      border-radius: 10px;
      background: #252525;
      color: white;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(45deg, #ff0050, #00d9ff);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .switch {
      text-align: center;
      color: #aaa;
      margin-top: 10px;
      cursor: pointer;
    }

    .switch span {
      color: #00e5ff;
      font-weight: bold;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">Vibzo</div>

  <div class="subtitle">
    Short videos. Real vibes.
  </div>

  <!-- REGISTER -->
  <div class="box" id="registerBox">

    <h2 style="text-align:center; margin-bottom:20px;">
      Create Account
    </h2>

    <input
      type="text"
      id="regUsername"
      placeholder="Username"
    >

    <input
      type="text"
      id="regName"
      placeholder="Display Name"
    >

    <input
      type="email"
      id="regEmail"
      placeholder="Email"
    >

    <input
      type="password"
      id="regPassword"
      placeholder="Password"
    >

    <button onclick="register()">
      Register
    </button>

    <div class="switch" onclick="showLogin()">
      Already have an account?
      <span>Login</span>
    </div>

  </div>


  <!-- LOGIN -->
  <div class="box hidden" id="loginBox">

    <h2 style="text-align:center; margin-bottom:20px;">
      Welcome Back
    </h2>

    <input
      type="email"
      id="loginEmail"
      placeholder="Email"
    >

    <input
      type="password"
      id="loginPassword"
      placeholder="Password"
    >

    <button onclick="login()">
      Login
    </button>

    <div class="switch" onclick="showRegister()">
      Don't have an account?
      <span>Register</span>
    </div>

  </div>

  <div id="message"></div>

</div>


<script>

  // ================================
  // SUPABASE CONFIG
  // ================================

  const SUPABASE_URL =
    "https://pesouroiuxqnkftasgna.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_bIp4te6AfRyWnRE4GThRIg_LkwwnQBK";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ================================
  // SHOW LOGIN
  // ================================

  function showLogin() {

    document
      .getElementById("registerBox")
      .classList.add("hidden");

    document
      .getElementById("loginBox")
      .classList.remove("hidden");

    document.getElementById("message").innerText = "";
  }


  // ================================
  // SHOW REGISTER
  // ================================

  function showRegister() {

    document
      .getElementById("loginBox")
      .classList.add("hidden");

    document
      .getElementById("registerBox")
      .classList.remove("hidden");

    document.getElementById("message").innerText = "";
  }


  // ================================
  // ENSURE PROFILE
  // ================================

  async function ensureProfile() {

    const {
      data: {
        user
      }
    } = await supabaseClient.auth.getUser();

    if (!user) return;

    const username =
      user.user_metadata?.username ||
      "user" + user.id.substring(0, 6);

    const displayName =
      user.user_metadata?.display_name ||
      username;

    const { error } =
      await supabaseClient
        .from("profiles")
        .upsert({
          id: user.id,
          username: username,
          display_name: displayName
        });

    if (error) {
      console.log(error);
    }
  }


  // ================================
  // REGISTER
  // ================================

  async function register() {

    const username =
      document.getElementById("regUsername").value.trim();

    const displayName =
      document.getElementById("regName").value.trim();

    const email =
      document.getElementById("regEmail").value.trim();

    const password =
      document.getElementById("regPassword").value;


    if (!username || !displayName || !email || !password) {

      document.getElementById("message").innerText =
        "সব তথ্য পূরণ করুন।";

      return;
    }


    document.getElementById("message").innerText =
      "Account তৈরি হচ্ছে...";


    const {
      data,
      error
    } = await supabaseClient.auth.signUp({

      email: email,

      password: password,

      options: {
        data: {
          username: username,
          display_name: displayName
        }
      }

    });


    if (error) {

      document.getElementById("message").innerText =
        error.message;

      return;
    }


    // Email confirmation লাগলে

    if (!data.session) {

      document.getElementById("message").innerText =
        "Registration সফল হয়েছে! 📧 আপনার Email চেক করে Confirm করুন।";

      return;
    }


    await ensureProfile();


    document.getElementById("message").innerText =
      "Registration সফল হয়েছে! 🎉";


    // Login হয়ে গেলে Home page

    window.location.href = "home.html";

  }


  // ================================
  // LOGIN
  // ================================

  async function login() {

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;


    if (!email || !password) {

      document.getElementById("message").innerText =
        "Email এবং Password দিন।";

      return;
    }


    document.getElementById("message").innerText =
      "Login হচ্ছে...";


    const {
      data,
      error
    } = await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });


    if (error) {

      document.getElementById("message").innerText =
        error.message;

      return;
    }


    await ensureProfile();


    document.getElementById("message").innerText =
      "Login সফল হয়েছে! 🎉";


    // ================================
    // LOGIN সফল হলে HOME PAGE
    // ================================

    window.location.href = "home.html";

  }

</script>

</body>
</html>
